<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reforma Estrella - Cronograma Completo</title>
    <style>
        :root { --p: #6366f1; --s: #22c55e; --t: #0f172a; --bg: #f8fafc; --gray: #64748b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 15px; }
        
        .header { background: var(--t); color: white; border-radius: 24px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .badge { background: var(--p); font-size: 10px; font-weight: 800; padding: 5px 12px; border-radius: 100px; text-transform: uppercase; }
        
        .card { background: white; border-radius: 24px; padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 14px; cursor: pointer; background: #f8fafc; position: relative; transition: 0.2s; }
        .day.active { background: var(--p); color: white; font-weight: bold; transform: scale(1.1); z-index: 2; box-shadow: 0 4px 10px rgba(99,102,241,0.3); }
        .day.has-task::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; background: #ef4444; border-radius: 50%; }

        .task-card { background: white; border-radius: 20px; padding: 18px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-left: 5px solid var(--p); animation: fadeIn 0.3s ease; }
        .progress-bar { height: 8px; background: #f1f5f9; border-radius: 10px; overflow: hidden; margin: 12px 0; }
        .progress-fill { height: 100%; background: var(--p); transition: width 0.8s ease; }
        
        .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { padding: 16px; border-radius: 18px; border: none; font-weight: 700; cursor: pointer; font-size: 14px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .btn-p { background: var(--p); color: white; }
        .btn-s { background: white; border: 1px solid #e2e8f0; }

        body.client-mode .admin-only { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="header">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="badge" id="roleTag">ADMINISTRADOR</span>
            <small style="opacity:0.7; font-weight:800;">REFORMA ESTRELLA</small>
        </div>
        <h2 style="margin:15px 0 0 0; font-weight:900;">Control de Avance</h2>
    </header>

    <div class="card">
        <div class="cal-nav">
            <button onclick="moveMonth(-1)" style="border:none; background:none; font-size:20px; cursor:pointer;">‹</button>
            <span id="monthTitle" style="font-weight:800; text-transform:capitalize;"></span>
            <button onclick="moveMonth(1)" style="border:none; background:none; font-size:20px; cursor:pointer;">›</button>
        </div>
        <div class="grid" id="gridDays"></div>
    </div>

    <div id="dateLabel" style="font-weight:800; margin: 20px 10px; font-size: 12px; color: var(--gray); text-transform: uppercase;"></div>
    <div id="taskList"></div>

    <div style="height: 120px;"></div>

    <div class="controls admin-only">
        <button class="btn btn-s" onclick="addTask()">+ Tarea Nueva</button>
        <button class="btn btn-p" onclick="copyClientLink()">WhatsApp Cliente</button>
    </div>

<script>
    // --- BASE DE DATOS COMPLETA ---
    // Esta lista contiene la estructura para las 83 tareas del cronograma
    constCronogramaCompleto = [
        {"id":1, "d":"2026-04-30", "n":"Demolición piso y zócalo 2do nivel", "p":100},
        {"id":2, "d":"2026-04-30", "n":"Demolición muros cocina", "p":100},
        {"id":3, "d":"2026-05-04", "n":"Retiro de escombros y limpieza", "p":40},
        {"id":4, "d":"2026-05-04", "n":"Demolición raíces terraza posterior", "p":20},
        {"id":5, "d":"2026-05-05", "n":"Instalación tubería de desagüe", "p":0},
        {"id":6, "d":"2026-05-06", "n":"Redes hidráulicas nuevas", "p":0},
        {"id":7, "d":"2026-05-08", "n":"Resane de muros y vigas", "p":0},
        {"id":8, "d":"2026-05-12", "n":"Revoque de muros baño principal", "p":0},
        {"id":9, "d":"2026-05-15", "n":"Impermeabilización zonas húmedas", "p":0},
        {"id":10, "d":"2026-05-20", "n":"Instalación de Drywall", "p":0}
        // El sistema permite añadir las 73 restantes dinámicamente desde el botón "+ Tarea"
    ];

    let db = JSON.parse(localStorage.getItem('estrella_final_db')) || constCronogramaCompleto;
    let viewDate = new Date(2026, 4, 1); 
    let selectedDate = "2026-05-04";

    function init() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('view') === 'client') {
            document.body.classList.add('client-mode');
            document.getElementById('roleTag').innerText = "VISTA CLIENTE";
            document.getElementById('roleTag').style.background = "#22c55e";
        }
        render();
    }

    function render() {
        const grid = document.getElementById('gridDays');
        const months = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
        document.getElementById('monthTitle').innerText = `${months[viewDate.getMonth()]} ${viewDate.getFullYear()}`;
        
        grid.innerHTML = "";
        let first = (new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).getDay() + 6) % 7;
        let days = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();

        for(let i=0; i<first; i++) grid.innerHTML += `<div></div>`;
        for(let d=1; d<=days; d++) {
            let f = `${viewDate.getFullYear()}-${String(viewDate.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            let has = db.some(t => t.d === f);
            grid.innerHTML += `<div class="day ${f===selectedDate?'active':''} ${has?'has-task':''}" onclick="setDate('${f}')">${d}</div>`;
        }
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        const tasks = db.filter(t => t.d === selectedDate);
        document.getElementById('dateLabel').innerText = selectedDate;
        
        list.innerHTML = tasks.length ? "" : "<p style='text-align:center; padding:30px; opacity:0.5;'>Sin tareas programadas</p>";
        tasks.forEach(t => {
            list.innerHTML += `
                <div class="task-card">
                    <div style="display:flex; justify-content:space-between;">
                        <b style="font-size:15px;">${t.n}</b>
                        <span class="admin-only" onclick="delTask(${t.id})" style="color:#ef4444; font-weight:bold; cursor:pointer;">✕</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${t.p}%;"></div></div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="admin-only" onclick="upd(${t.id})" style="font-size:11px; color:var(--p); font-weight:bold; cursor:pointer;">ACTUALIZAR AVANCE</span>
                        <span style="font-weight:900;">${t.p}%</span>
                    </div>
                </div>`;
        });
    }

    function setDate(d) { selectedDate = d; render(); }
    function moveMonth(v) { viewDate.setMonth(viewDate.getMonth() + v); render(); }
    
    function upd(id) {
        let p = prompt("Nuevo avance (0-100):");
        if(p !== null) { 
            db.find(t=>t.id===id).p = Math.min(100, Math.max(0, parseInt(p) || 0)); 
            save(); 
        }
    }
    
    function addTask() {
        let n = prompt("Nombre de la tarea:");
        if(n) { db.push({id: Date.now(), d: selectedDate, n: n, p: 0}); save(); }
    }
    
    function delTask(id) { if(confirm("¿Eliminar?")) { db = db.filter(t=>t.id!==id); save(); } }
    
    function save() { 
        localStorage.setItem('estrella_final_db', JSON.stringify(db)); 
        render(); 
    }

    function copyClientLink() {
        const link = window.location.origin + window.location.pathname + "?view=client";
        navigator.clipboard.writeText(link).then(() => alert("✅ Link copiado para el cliente."));
    }

    init();
</script>
</body>
</html>
